name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lynk_user
          POSTGRES_PASSWORD: lynk_password
          POSTGRES_DB: lynk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynk_user -d lynk_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lynk_user:lynk_password@localhost:5432/lynk_db?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum
      # golangci-lint v1 binaries are built with Go 1.24 and reject go.mod go 1.25.
      # v2.4+ (via action v9) is required for Go 1.25 support.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.4.0
      - name: Verify SQL migrations up and rollback (throwaway database)
        env:
          PGPASSWORD: lynk_password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
          psql -h localhost -U lynk_user -d lynk_db -c "DROP DATABASE IF EXISTS lynk_migrate_check;"
          psql -h localhost -U lynk_user -d lynk_db -c "CREATE DATABASE lynk_migrate_check;"
          # 1. Verify forward migrations
          migrate -path backend/migrations -database "postgres://lynk_user:lynk_password@localhost:5432/lynk_migrate_check?sslmode=disable" up
          # 2. Verify rollback down migrations
          migrate -path backend/migrations -database "postgres://lynk_user:lynk_password@localhost:5432/lynk_migrate_check?sslmode=disable" down -all
          # 3. Verify re-application idempotency
          migrate -path backend/migrations -database "postgres://lynk_user:lynk_password@localhost:5432/lynk_migrate_check?sslmode=disable" up
          psql -h localhost -U lynk_user -d lynk_db -c "DROP DATABASE lynk_migrate_check;"
      - name: Apply application migrations
        working-directory: backend
        run: go test -v -run ^TestRunMigrations_AppliesInitOnEmptyDatabase$ ./internal/database
      - name: Test with race detector
        working-directory: backend
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm test uses node --experimental-strip-types (Node 22+)
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  ai:
    name: AI Subsystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt

      - name: Run Pytest Suite
        run: python -m pytest ai/tests/ -v

      - name: Run Offline IR Evaluation Harness
        run: python -m ai.evaluation.harness
