name: API Contract Drift Verification

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contract-alignment:
    name: Verify Go and TypeScript Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Verify Go Contract Serialization
        working-directory: backend
        run: go test -v -run TestContractDrift ./internal/ai/client/...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Contract Alignment
        working-directory: frontend
        run: |
          npm ci
          node --test src/types/contract-drift.test.ts
