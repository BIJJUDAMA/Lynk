repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(\.github/|docker-compose)
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix, --config=ai/pyproject.toml]
        files: ^ai/
      - id: ruff-format
        args: [--config=ai/pyproject.toml]
        files: ^ai/

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt -w -s
        language: system
        types: [go]
        files: ^backend/
      - id: golangci-lint
        name: golangci-lint
        entry: python -c "import shutil, subprocess, sys; sys.exit(subprocess.call(['golangci-lint', 'run', '--timeout=5m']) if shutil.which('golangci-lint') else 0)"
        language: system
        types: [go]
        files: ^backend/
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        files: ^frontend/src/
