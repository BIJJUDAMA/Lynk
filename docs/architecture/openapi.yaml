        - title
        - description
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        required_skills:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 25
        department:
          type: string
        deadline:
          type: string
          format: date-time

    UpdateJobRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        required_skills:
          type: array
          items:
