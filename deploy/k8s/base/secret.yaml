apiVersion: v1
kind: Secret
metadata:
  name: lynk-api-secrets
  namespace: lynk-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://lynk_user:lynk_secret_pass@pgbouncer.lynk-production.svc.cluster.local:6432/lynk?sslmode=disable"
  REDIS_PASSWORD: "lynk-redis-prod-secret"
  REDIS_URL: "redis://:lynk-redis-prod-secret@redis.lynk-production.svc.cluster.local:6379/0"
  SUPERTOKENS_API_KEY: "lynk-supertokens-core-prod-secret"
  MINIO_ACCESS_KEY: "lynk-minio-prod-access"
  MINIO_SECRET_KEY: "lynk-minio-prod-secret"
