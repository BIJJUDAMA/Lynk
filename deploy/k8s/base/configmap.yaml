apiVersion: v1
kind: ConfigMap
metadata:
  name: lynk-api-config
  namespace: lynk-production
data:
  APP_ENV: "production"
  PORT: "8080"
  SUPERTOKENS_CONNECTION_URI: "http://supertokens.lynk-production.svc.cluster.local:3567"
  MINIO_ENDPOINT: "minio.lynk-production.svc.cluster.local:9000"
  MINIO_PUBLIC_ENDPOINT: "https://minio.campus.edu"
  MINIO_BUCKET: "resumes"
  MINIO_USE_SSL: "false"
  API_DOMAIN: "https://api.campus.edu"
  WEBSITE_DOMAIN: "https://campus.edu"
  CORS_ALLOWED_ORIGINS: "https://campus.edu"
  RATE_LIMIT_PER_MINUTE: "2000"
  CACHE_DEFAULT_TTL: "60s"
  L1_SHARDS: "64"
  DB_MAX_CONNS: "50"
  DB_MIN_CONNS: "10"
