apiVersion: v1
kind: ConfigMap
metadata:
  name: lynk-api-config
  namespace: lynk-production
data:
  APP_ENV: "production"
  PORT: "8080"
  SUPERTOKENS_CONNECTION_URI: "http://supertokens.lynk-production.svc.cluster.local:3567"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis.lynk-production.svc.cluster.local:6379/0"
  RATE_LIMIT_PER_MINUTE: "2000"
  CACHE_DEFAULT_TTL: "60s"
  L1_SHARDS: "64"
  DB_MAX_CONNS: "50"
  DB_MIN_CONNS: "10"
