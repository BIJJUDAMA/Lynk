services:
  postgres:
    image: postgres:16-alpine
    container_name: lynk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lynk_user
      POSTGRES_PASSWORD: lynk_password
      POSTGRES_DB: lynk_db
      POSTGRES_MULTIPLE_DATABASES: "lynk_db,supertokens_db"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynk_user -d lynk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:9.3
    container_name: lynk-supertokens
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://lynk_user:lynk_password@postgres:5432/supertokens_db"
      API_KEYS: "${SUPERTOKENS_API_KEY:-lynk_supertokens_secret_api_key_2026}"
    ports:
      - "3567:3567"
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/3567 && echo -e 'GET /hello HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'Hello'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: lynk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lynk-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://lynk_user:lynk_password@postgres:5432/lynk_db?sslmode=disable"
      MIGRATIONS_DIR: "/app/migrations"
      SUPERTOKENS_CONNECTION_URI: "http://supertokens:3567"
      SUPERTOKENS_API_KEY: "${SUPERTOKENS_API_KEY:-lynk_supertokens_secret_api_key_2026}"
      API_DOMAIN: "http://localhost:8080"
      WEBSITE_DOMAIN: "http://localhost:3000"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minio_password}"
      MINIO_BUCKET: "resumes"
      MINIO_USE_SSL: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  lynk-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
