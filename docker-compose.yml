services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lynk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lynk_user
      POSTGRES_PASSWORD: lynk_password
      POSTGRES_DB: lynk_db
      POSTGRES_MULTIPLE_DATABASES: "lynk_db,supertokens_db"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynk_user -d lynk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:9.3
    container_name: lynk-supertokens
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://lynk_user:lynk_password@postgres:5432/supertokens_db"
      API_KEYS: "${SUPERTOKENS_API_KEY:-lynk-supertokens-secret-api-key-2026}"
    ports:
      - "3567:3567"
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3567/hello || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: lynk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lynk-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://lynk_user:lynk_password@postgres:5432/lynk_db?sslmode=disable"
      MIGRATIONS_DIR: "/app/migrations"
      SUPERTOKENS_CONNECTION_URI: "http://supertokens:3567"
      SUPERTOKENS_API_KEY: "${SUPERTOKENS_API_KEY:-lynk-supertokens-secret-api-key-2026}"
      API_DOMAIN: "http://localhost:8080"
      WEBSITE_DOMAIN: "http://localhost:3000"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minio_password}"
      MINIO_BUCKET: "resumes"
      MINIO_USE_SSL: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      AI_API_URL: "http://ai-api:8000"
      INTERNAL_AI_SECRET: "${INTERNAL_AI_SECRET:-lynk-ai-internal-secret-key-2026}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai-api:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: lynk-ai-api
    restart: unless-stopped
    environment:
      PORT: "8000"
      INTERNAL_AI_SECRET: "${INTERNAL_AI_SECRET:-lynk-ai-internal-secret-key-2026}"
      DATABASE_URL: "postgres://lynk_user:lynk_password@postgres:5432/lynk_db?sslmode=disable"
      VLLM_URL: "http://vllm:8000/v1"
    ports:
      - "8000:8000"
    networks:
      - lynk-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-worker:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: lynk-ai-worker
    restart: unless-stopped
    command: python -m ai.workers.worker
    environment:
      INTERNAL_AI_SECRET: "${INTERNAL_AI_SECRET:-lynk-ai-internal-secret-key-2026}"
      DATABASE_URL: "postgres://lynk_user:lynk_password@postgres:5432/lynk_db?sslmode=disable"
    networks:
      - lynk-net
    depends_on:
      postgres:
        condition: service_healthy

  vllm:
    image: vllm/vllm-openai:latest
    container_name: lynk-vllm
    profiles:
      - vllm
      - gpu
    networks:
      - lynk-net

networks:
  lynk-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
