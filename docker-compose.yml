services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lynk-postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=200
    environment:
      POSTGRES_USER: lynk_user
      POSTGRES_PASSWORD: lynk_password
      POSTGRES_DB: lynk_db
      POSTGRES_MULTIPLE_DATABASES: "lynk_db,supertokens_db"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynk_user -d lynk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:9.3
    container_name: lynk-supertokens
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://lynk_user:lynk_password@postgres:5432/supertokens_db"
      API_KEYS: "${SUPERTOKENS_API_KEY:-lynksupertokenssecretapikey2026dev}"
    ports:
      - "3567:3567"
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3567/hello || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lynk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lynk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: lynk-pgbouncer
    restart: unless-stopped
    volumes:
      - ./.docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./.docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    networks:
      - lynk-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U lynk_user -d lynk_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://lynk_user:lynk_password@pgbouncer:6432/lynk_db?sslmode=disable"
      MIGRATION_DATABASE_URL: "postgres://lynk_user:lynk_password@postgres:5432/lynk_db?sslmode=disable"
      MIGRATIONS_DIR: "/app/migrations"
      SUPERTOKENS_CONNECTION_URI: "http://supertokens:3567"
      SUPERTOKENS_API_KEY: "${SUPERTOKENS_API_KEY:-lynksupertokenssecretapikey2026dev}"
      API_DOMAIN: "http://localhost:8080"
      WEBSITE_DOMAIN: "http://localhost:3000"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minio_password}"
      MINIO_BUCKET: "resumes"
      MINIO_USE_SSL: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      AI_API_URL: "http://ai-api:8000"
      INTERNAL_AI_SECRET: "${INTERNAL_AI_SECRET:-lynk-ai-internal-secret-key-2026}"
      REDIS_URL: "redis://redis:6379"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      TRUST_FORWARDED_FOR: "${TRUST_FORWARDED_FOR:-true}"
      GOMEMLIMIT: "750MiB"
      GOGC: "100"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    image: nginx:1.25-alpine
    container_name: lynk-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-api:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: lynk-ai-api
    restart: unless-stopped
    environment:
      PORT: "8000"
      INTERNAL_AI_SECRET: "${INTERNAL_AI_SECRET:-lynk-ai-internal-secret-key-2026}"
      DATABASE_URL: "postgres://lynk_user:lynk_password@postgres:5432/lynk_db?sslmode=disable"
      VLLM_URL: "http://vllm:8000/v1"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "8000:8000"
    networks:
      - lynk-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-worker:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: lynk-ai-worker
    restart: unless-stopped
    profiles:
      - workers
      - full
    command: python -m ai.workers.worker
    environment:
      INTERNAL_AI_SECRET: "${INTERNAL_AI_SECRET:-lynk-ai-internal-secret-key-2026}"
      DATABASE_URL: "postgres://lynk_user:lynk_password@postgres:5432/lynk_db?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
    networks:
      - lynk-net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
        NEXT_PUBLIC_WEBSITE_URL: "http://localhost:3000"
    container_name: lynk-frontend
    restart: unless-stopped
    profiles:
      - frontend
      - full
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_WEBSITE_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lynk-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', (r) => {if (r.statusCode >= 200 && r.statusCode < 400) process.exit(0); else process.exit(1);}).on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  vllm:
    image: vllm/vllm-openai:latest
    container_name: lynk-vllm
    profiles:
      - vllm
      - gpu
    networks:
      - lynk-net

networks:
  lynk-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
