global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "lynk-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: "lynk-api"
          tier: "backend"

  - job_name: "lynk-ai-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-api:8000"]
        labels:
          service: "lynk-ai-api"
          tier: "ai"

  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"
          tier: "telemetry"

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: "rabbitmq"
          tier: "messaging"
