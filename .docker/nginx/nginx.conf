user nginx;
worker_processes auto;
worker_rlimit_nofile 262144;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    proxy_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=MICROCACHE:10m max_size=256m inactive=60s use_temp_path=off;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream lynk_api_cluster {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;

        set $skip_cache 0;
        if ($request_method != GET) {
            set $skip_cache 1;
        }
        if ($http_authorization != "") {
            set $skip_cache 1;
        }
        if ($http_cookie ~* "sAccessToken") {
            set $skip_cache 1;
        }

        location ~ ^/api/v1/projects$ {
            proxy_pass http://lynk_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache MICROCACHE;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 1s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
        }

        location /api/v1/events/stream {
            proxy_pass http://lynk_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding on;
        }

        location / {
            proxy_pass http://lynk_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Server-side connection count for the load-test suite's connection
        # ceiling driver (tests/load/connections.js reads Active connections).
        location = /nginx_status {
            stub_status;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
        }
    }
}
