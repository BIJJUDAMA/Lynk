[databases]
lynk_db = host=postgres port=5432 dbname=lynk_db auth_user=lynk_user
supertokens_db = host=postgres port=5432 dbname=supertokens_db auth_user=lynk_user

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = lynk_user
stats_users = lynk_user
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 35
server_idle_timeout = 600
server_reset_query = DISCARD ALL
