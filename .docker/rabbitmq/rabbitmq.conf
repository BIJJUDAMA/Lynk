# RabbitMQ Node Configuration for Lynk Platform
# Pure 7-bit ASCII

default_vhost = /
default_user = guest
default_pass = guest

# Flow control alarms
# High memory watermark: trigger flow control backpressure at 60% of container memory
vm_memory_high_watermark.relative = 0.6

# Disk free space safety limit: pause publishers when available disk drops below 1.5x RAM
disk_free_limit.relative = 1.5

# Connection & channel bounds
channel_max = 2047
heartbeat = 60
collect_statistics_interval = 10000

# Logging
log.console = true
log.console.level = info
